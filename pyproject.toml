[project]
name = "openclass-ai"
version = "0.1.0"
description = "Evidence-based learning intelligence with Google ADK and Gemini"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
 "uvicorn[standard]>=0.34,<1",
 "google-adk[db]>=2.0,<3",
 "asyncpg>=0.30,<1",
 "python-dotenv>=1,<2",
 "httpx>=0.28,<1",
 "psycopg[binary,pool]>=3.2,<4",
 "a2a-sdk[http-server]>=0.3.24,<0.4",
]

[project.optional-dependencies]
cloud = ["google-cloud-aiplatform[agent_engines]>=1.120", "google-cloud-agentplatform[adk]", "google-cloud-modelarmor>=0.2", "google-auth>=2.62", "mcp>=1.20,<2", "PyJWT[crypto]>=2.10,<3"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*", "mcp_service*", "mcp_servers*"]

[tool.setuptools.data-files]
"share/openclass/security" = ["security/agent-policy.json"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
